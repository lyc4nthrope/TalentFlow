            }
            scriptPath('microservicios/gestion-vacaciones/Jenkinsfile')
          }
        }
        queue('gestion-vacaciones')
      }

      // 5. Gestión Perfiles (Python)
      pipelineJob('gestion-perfiles') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/lyc4nthrope/TalentFlow.git')
                }
                branches('*/Vale292005')
              }
            }
            scriptPath('microservicios/gestion-perfiles/Jenkinsfile')
          }
        }
        queue('gestion-perfiles')
