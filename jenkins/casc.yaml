jenkins:
  systemMessage: "Servidor CI/CD - TalentFlow"

jobs:
  - script: |
      // Pipeline E2E
      pipelineJob('pipeline-orquestador-e2e') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/lyc4nthrope/TalentFlow.git') 
                }
                branches('*/Vale292005')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        queue('pipeline-orquestador-e2e') // <-- Dispara la ejecución al crear/actualizar el job
      }

      // 1. Gestión Empleados (Node.js)
      pipelineJob('gestion-empleados') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/lyc4nthrope/TalentFlow.git')
                }
                branches('*/Vale292005')
              }
            }
            scriptPath('microservicios/gestion-empleados/Jenkinsfile')
          }
        }
        queue('gestion-empleados')
      }

      // 2. Auth Service (Go)
      pipelineJob('auth-service') {
