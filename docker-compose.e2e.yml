x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:-talentflow_super_secret_2026}
  JWT_ISSUER: ${JWT_ISSUER:-auth-service}

services:
  # Servicio MailHog para la captura y verificación de emails
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI y API REST
    networks:
      - microservices-network

  # Message Broker (RabbitMQ) - Carga directa de la topologia
  message-broker:
    image: rabbitmq:3.13-management-alpine
    hostname: message-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    expose:
      - "5672"
      - "15672"
    volumes:
      - vol-rabbitmq-e2e:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # Paso de inicialización del broker: importa la topología de eventos
  broker-init:
    image: rabbitmq:3.13-management-alpine
    entrypoint: ["sh", "/importar-definiciones.sh"]
    restart: "no"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
    volumes:
      - ./infra/rabbitmq/importar-definiciones.sh:/importar-definiciones.sh:ro
      - ./infra/rabbitmq/definitions.json:/definitions.json:ro
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network

  # Base de Datos Autenticación
  database-auth:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_AUTH_NAME:-db_auth}
      POSTGRES_USER: ${DB_AUTH_USER:-user_auth}
      POSTGRES_PASSWORD: ${DB_AUTH_PASS:-pass_auth}
    expose:
      - "5432"
    volumes:
      - vol-auth-e2e:/var/lib/postgresql/data
      - ./microservicios/auth-service/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_AUTH_USER:-user_auth} -d ${DB_AUTH_NAME:-db_auth}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Autenticación
  auth-service:
    build:
      context: ./microservicios/auth-service
      dockerfile: Dockerfile
      target: runner                          
    image: localhost:5000/auth-service:latest
    restart: always
    environment:
      <<: *jwt
      PORT: 8086                               
      DB_HOST: database-auth
      DB_PORT: 5432
      DB_NAME: ${DB_AUTH_NAME:-db_auth}
      DB_USER: ${DB_AUTH_USER:-user_auth}
      DB_PASS: ${DB_AUTH_PASS:-pass_auth}
      JWT_VIGENCIA: ${JWT_VIGENCIA:-1h}
      TOKEN_ACTIVACION_VIGENCIA: ${TOKEN_ACTIVACION_VIGENCIA:-24h}
      TOKEN_RECUPERACION_VIGENCIA: ${TOKEN_RECUPERACION_VIGENCIA:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
    expose:
      - "8086"
    depends_on:
      database-auth:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/auth-service", "-salud"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - microservices-network

  # Base de Datos Empleados
  database-empleados:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_EMPLEADOS_NAME:-db_empleados}
      POSTGRES_USER: ${DB_EMPLEADOS_USER:-user_empleados}
      POSTGRES_PASSWORD: ${DB_EMPLEADOS_PASS:-pass_empleados}
    expose:
      - "5432"
    volumes:
      - vol-empleados-e2e:/var/lib/postgresql/data
      - ./microservicios/gestion-empleados/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Empleados
  empleados-service:
    build:
      context: ./microservicios/gestion-empleados
      dockerfile: Dockerfile
      target: runner
    restart: on-failure
    expose:
      - "8081"
    environment:
      PORT: 8081
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${DB_EMPLEADOS_NAME:-db_empleados}
      DB_USER: ${DB_EMPLEADOS_USER:-user_empleados}
      DB_PASS: ${DB_EMPLEADOS_PASS:-pass_empleados}
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8082
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      ZONA_HORARIA: America/Bogota
    depends_on:
      database-empleados:
        condition: service_healthy
      departamentos-service:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Base de Datos Departamentos (MySQL)
  database-departamentos:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DEPTO_NAME:-db_deptos}
      MYSQL_USER: ${DB_DEPTO_USER:-user_deptos}
      MYSQL_PASSWORD: ${DB_DEPTO_PASS:-pass_deptos}
      MYSQL_ROOT_PASSWORD: ${DB_DEPTO_ROOT_PASS:-root_pass}
    expose:
      - "3306"
    volumes:
      - vol-departamentos-e2e:/var/lib/mysql
      - ./microservicios/gestion-departamentos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_DEPTO_USER:-user_deptos}", "-p${DB_DEPTO_PASS:-pass_deptos}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Microservicio Departamentos
  departamentos-service:
    build:
      context: ./microservicios/gestion-departamentos
      dockerfile: Dockerfile
      target: runner
    restart: on-failure
    expose:
      - "8082"
    environment:
      PORT: 8082
      DB_HOST: database-departamentos
      DB_PORT: 3306
      DB_NAME: ${DB_DEPTO_NAME:-db_deptos}
      DB_USER: ${DB_DEPTO_USER:-user_deptos}
      DB_PASS: ${DB_DEPTO_PASS:-pass_deptos}
    depends_on:
      database-departamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8082/health\") === false ? 1 : 0);'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Base de Datos Notificaciones
  database-notificaciones:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NOTIF_NAME:-db_notificaciones}
      POSTGRES_USER: ${DB_NOTIF_USER:-user_notificaciones}
      POSTGRES_PASSWORD: ${DB_NOTIF_PASS:-pass_notificaciones}
    expose:
      - "5432"
    volumes:
      - vol-notificaciones-e2e:/var/lib/postgresql/data
      - ./microservicios/notificaciones/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Notificaciones
  notificaciones-service:
    build:
      context: ./microservicios/notificaciones
      dockerfile: Dockerfile
      target: runner
    restart: on-failure
    expose:
      - "8084"
    environment:
      PORT: 8084
      DB_HOST: database-notificaciones
      DB_PORT: 5432
      DB_NAME: ${DB_NOTIF_NAME:-db_notificaciones}
      DB_USER: ${DB_NOTIF_USER:-user_notificaciones}
      DB_PASS: ${DB_NOTIF_PASS:-pass_notificaciones}
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_COLA: notificaciones.eventos
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      database-notificaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "/notificaciones", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - microservices-network

  # Base de Datos Perfiles
  database-perfiles:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_PERFILES_NAME:-db_perfiles}
      POSTGRES_USER: ${DB_PERFILES_USER:-user_perfiles}
      POSTGRES_PASSWORD: ${DB_PERFILES_PASS:-pass_perfiles}
    expose:
      - "5432"
    volumes:
      - vol-perfiles-e2e:/var/lib/postgresql/data
      - ./microservicios/gestion-perfiles/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Perfiles
  perfiles-service:
    build:
      context: ./microservicios/gestion-perfiles
      dockerfile: Dockerfile
      target: runner
    restart: on-failure
    expose:
      - "8083"
    environment:
      DB_HOST: database-perfiles
      DB_PORT: 5432
      DB_NAME: ${DB_PERFILES_NAME:-db_perfiles}
      DB_USER: ${DB_PERFILES_USER:-user_perfiles}
      DB_PASS: ${DB_PERFILES_PASS:-pass_perfiles}
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_COLA: perfiles.eventos
    depends_on:
      database-perfiles:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Base de Datos Vacaciones
  database-vacaciones:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_VACACIONES_NAME:-db_vacaciones}
      POSTGRES_USER: ${DB_VACACIONES_USER:-user_vacaciones}
      POSTGRES_PASSWORD: ${DB_VACACIONES_PASS:-pass_vacaciones}
    expose:
      - "5432"
    volumes:
      - vol-vacaciones-e2e:/var/lib/postgresql/data
      - ./microservicios/gestion-vacaciones/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Vacaciones
  vacaciones-service:
    build:
      context: ./microservicios/gestion-vacaciones
      dockerfile: Dockerfile
      target: runner
    restart: on-failure
    expose:
      - "8085"
    environment:
      PORT: 8085
      DB_HOST: database-vacaciones
      DB_PORT: 5432
      DB_NAME: ${DB_VACACIONES_NAME:-db_vacaciones}
      DB_USER: ${DB_VACACIONES_USER:-user_vacaciones}
      DB_PASS: ${DB_VACACIONES_PASS:-pass_vacaciones}
      SPRING_RABBITMQ_HOST: message-broker
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-admin}
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_COLA: vacaciones.eventos
      ZONA_HORARIA: America/Bogota
      VACACIONES_CRON: ${VACACIONES_CRON:-0 * * * * *}
    depends_on:
      database-vacaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - microservices-network

  # API Gateway
  api-gateway:
    build:
      context: ./microservicios/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8088:8080"
    environment:
      <<: *jwt
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8086
      EMPLEADOS_SERVICE_URL: http://empleados-service:8081
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8082
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8084
      PERFILES_SERVICE_URL: http://perfiles-service:8083
      VACACIONES_SERVICE_URL: http://vacaciones-service:8085
    depends_on:
      auth-service:
        condition: service_healthy
      empleados-service:
        condition: service_healthy
      departamentos-service:
        condition: service_healthy
      notificaciones-service:
        condition: service_healthy
      perfiles-service:
        condition: service_healthy
      vacaciones-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - microservices-network

  # Contenedor para ejecutar los Test BDD
  bdd-tests:
    build:
      context: ./e2e-tests
      dockerfile: Dockerfile
    user: "0:0"
    environment:
      <<: *jwt
      BASE_URL: http://api-gateway:8080
      MAILHOG_URL: http://mailhog:8025
    volumes:
      - ./e2e-tests/reports:/app/reports
    depends_on:
      auth-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  vol-auth-e2e:
  vol-empleados-e2e:
  vol-departamentos-e2e:
  vol-rabbitmq-e2e:
  vol-notificaciones-e2e:
  vol-perfiles-e2e:
  vol-vacaciones-e2e: