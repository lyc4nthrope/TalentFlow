version: '3.8'

networks:
  microservices-network:
    driver: bridge

volumes:
  vol-vacaciones:

services:
  # Base de Datos de Vacaciones
  database-vacaciones:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_VACACIONES_NAME:-db_vacaciones}
      POSTGRES_USER: ${DB_VACACIONES_USER:-user_vacaciones}
      POSTGRES_PASSWORD: ${DB_VACACIONES_PASS:-pass_vacaciones}
    expose:
      - "5432"
    volumes:
      - vol-vacaciones:/var/lib/postgresql/data
      - ./microservicios/gestion-vacaciones/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_VACACIONES_USER:-user_vacaciones} -d ${DB_VACACIONES_NAME:-db_vacaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Microservicio Auth (Necesario para /auth/login)
  auth-service:
    image: localhost:5000/auth-service:latest
    restart: on-failure
    expose:
      - "8086"
    networks:
      - microservices-network

  # Microservicio Empleados
  gestion-empleados:
    image: localhost:5000/gestion-empleados:latest
    restart: on-failure
    expose:
      - "8081"
    networks:
      - microservices-network

  # Microservicio Vacaciones
  vacaciones-service:
    image: localhost:5000/gestion-vacaciones:latest
    restart: on-failure
    expose:
      - "8085"
    environment:
      PORT: 8085
      DB_HOST: database-vacaciones
      DB_PORT: 5432
      DB_NAME: ${DB_VACACIONES_NAME:-db_vacaciones}
      DB_USER: ${DB_VACACIONES_USER:-user_vacaciones}
      DB_PASS: ${DB_VACACIONES_PASS:-pass_vacaciones}
      ZONA_HORARIA: America/Bogota
      VACACIONES_CRON: "*/5 * * * * *"
    depends_on:
      database-vacaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - microservices-network

  # Suite de Pruebas BDD / Cucumber
  bdd-tests:
    build: ./e2e-tests
    profiles: ["e2e"]
    user: "root"
    environment:
      BASE_URL: http://vacaciones-service:8085
      AUTH_SERVICE_URL: http://auth-service:8086
      EMPLEADOS_SERVICE_URL: http://gestion-empleados:8081
      E2E_SCHEDULER_SEGUNDOS: 5
    depends_on:
      vacaciones-service:
        condition: service_healthy
    volumes:
      - ./e2e-tests/reports:/app/reports
    networks:
      - microservices-network