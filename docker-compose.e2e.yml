version: '3.8'

networks:
  microservices-network:
    driver: bridge

volumes:
  vol-vacaciones:

services:
  # 1. Base de Datos
  database-vacaciones:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_VACACIONES_NAME:-db_vacaciones}
      POSTGRES_USER: ${DB_VACACIONES_USER:-user_vacaciones}
      POSTGRES_PASSWORD: ${DB_VACACIONES_PASS:-pass_vacaciones}
    expose:
      - "5432"
    volumes:
      - vol-vacaciones:/var/lib/postgresql/data
      - ./microservicios/gestion-vacaciones/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_VACACIONES_USER:-user_vacaciones} -d ${DB_VACACIONES_NAME:-db_vacaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. Servicio de Autenticación
  auth-service:
    image: localhost:5000/auth-service:latest
    restart: on-failure
    expose:
      - "8086"
    networks:
      - microservices-network

  # 3. Servicio de Empleados
  gestion-empleados:
    image: localhost:5000/gestion-empleados:latest
    restart: on-failure
    expose:
      - "8081"
    networks:
      - microservices-network

  # 4. Servicio de Vacaciones
  vacaciones-service:
    image: localhost:5000/gestion-vacaciones:latest
    restart: on-failure
    expose:
      - "8085"
    environment:
      PORT: 8085
      DB_HOST: database-vacaciones
      DB_PORT: 5432
      DB_NAME: ${DB_VACACIONES_NAME:-db_vacaciones}
      DB_USER: ${DB_VACACIONES_USER:-user_vacaciones}
      DB_PASS: ${DB_VACACIONES_PASS:-pass_vacaciones}
      ZONA_HORARIA: America/Bogota
      VACACIONES_CRON: "*/5 * * * * *"
    depends_on:
      database-vacaciones:
        condition: service_healthy
    networks:
      - microservices-network

  # 5. API Gateway (Si existe en la solución)
  api-gateway:
    image: localhost:5000/api-gateway:latest
    restart: on-failure
    ports:
      - "8080:8080"
    networks:
      - microservices-network

  # 6. Contenedor de Pruebas BDD
  bdd-tests:
    build: ./e2e-tests
    profiles: ["e2e"]
    user: "root"
    environment:
      BASE_URL: http://api-gateway:8080  # Apuntar al Gateway que sabe redirigir /auth y /empleados
      E2E_SCHEDULER_SEGUNDOS: 5
    depends_on:
      vacaciones-service:
        condition: service_healthy
    volumes:
      - ./e2e-tests/reports:/app/reports
    networks:
      - microservices-network