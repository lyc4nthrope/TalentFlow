services:
  # Base de Datos Empleados (PostgreSQL)
  database-empleados:
    image: postgres:16-alpine
    container_name: db-empleados
    restart: always
    environment:
      POSTGRES_DB: ${DB_EMPLEADOS_NAME:-db_empleados}
      POSTGRES_USER: ${DB_EMPLEADOS_USER:-user_empleados}
      POSTGRES_PASSWORD: ${DB_EMPLEADOS_PASS:-pass_empleados}
    expose:
      - "5432"
    volumes:
      - vol-empleados:/var/lib/postgresql/data
      - ./microservicios/gestion-empleados/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_EMPLEADOS_USER:-user_empleados} -d ${DB_EMPLEADOS_NAME:-db_empleados}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Base de Datos Departamentos (MySQL)
  database-departamentos:
    image: mysql:8.0
    container_name: db-departamentos
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DEPTO_NAME:-db_deptos}
      MYSQL_USER: ${DB_DEPTO_USER:-user_deptos}
      MYSQL_PASSWORD: ${DB_DEPTO_PASS:-pass_deptos}
      MYSQL_ROOT_PASSWORD: ${DB_DEPTO_ROOT_PASS:-root_pass}
    expose:
      - "3306"
    volumes:
      - vol-departamentos:/var/lib/mysql
      - ./microservicios/gestion-departamentos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API Gateway para exponer un único puerto al cliente
  api-gateway:
    build:
      context: ./microservicios/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      EMPLEADOS_SERVICE_URL: http://empleados-service:8081
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8082
    depends_on:
      - empleados-service
      - departamentos-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - microservices-network

  # Microservicio Empleados (Node.js)
  empleados-service:
    build:
      context: .
      dockerfile: ./microservicios/gestion-empleados/Dockerfile
      target: runner
    container_name: ms-empleados
    restart: on-failure
    expose:
      - "8081"
    environment:
      PORT: 8081
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${DB_EMPLEADOS_NAME:-db_empleados}
      DB_USER: ${DB_EMPLEADOS_USER:-user_empleados}
      DB_PASS: ${DB_EMPLEADOS_PASS:-pass_empleados}
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8082
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      ZONA_HORARIA: America/Bogota
    depends_on:
      database-empleados:
        condition: service_healthy
      departamentos-service:
        condition: service_healthy
      # La topología de eventos debe existir antes de publicar el primer evento.
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Microservicio Departamentos (PHP)
  departamentos-service:
    build:
      context: ./microservicios/gestion-departamentos
      dockerfile: Dockerfile
      target: runner
    container_name: ms-departamentos
    restart: on-failure
    expose:
      - "8082"
    environment:
      PORT: 8082
      DB_HOST: database-departamentos
      DB_PORT: 3306
      DB_NAME: ${DB_DEPTO_NAME:-db_deptos}
      DB_USER: ${DB_DEPTO_USER:-user_deptos}
      DB_PASS: ${DB_DEPTO_PASS:-pass_deptos}
    depends_on:
      database-departamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8082/health\") === false ? 1 : 0);'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Message Broker (RabbitMQ) — comunicación asincrónica por eventos (Reto 4)
  message-broker:
    image: rabbitmq:3.13-management-alpine
    container_name: message-broker
    # Nombre de nodo estable: RabbitMQ guarda sus datos por nombre de nodo
    # (rabbit@<hostname>). Sin hostname fijo, recrear el contenedor cambiaría el
    # nombre y los mensajes persistidos en el volumen quedarían huérfanos.
    hostname: message-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    expose:
      - "5672"              # AMQP: solo dentro de la red de Docker
    ports:
      - "15672:15672"       # UI de administración (única excepción al Gateway, ver README)
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - microservices-network

  # Paso de inicialización (se ejecuta y termina): importa la topología de eventos
  # (infra/rabbitmq/definitions.json). Productores y consumidores esperan a que
  # termine con éxito, así el exchange y las colas existen antes del primer evento.
  broker-init:
    image: rabbitmq:3.13-management-alpine
    container_name: broker-init
    entrypoint: ["sh", "/importar-definiciones.sh"]
    restart: "no"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
    volumes:
      - ./infra/rabbitmq/importar-definiciones.sh:/importar-definiciones.sh:ro
      - ./infra/rabbitmq/definitions.json:/definitions.json:ro
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  vol-empleados:
  vol-departamentos:
  vol-rabbitmq: