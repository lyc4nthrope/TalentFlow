# Reto 5, D21: el secreto del JWT se define UNA sola vez y lo reciben quien firma
# (auth-service) y quien valida (api-gateway), así nunca divergen. Valor académico por
# defecto para arrancar con un solo comando; un .env lo sobrescribe. El código no tiene
# valor por defecto: sin JWT_SECRET ninguno de los dos arranca.
x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:-talentflow_super_secret_2026}
  JWT_ISSUER: ${JWT_ISSUER:-auth-service}

# Reto 8, D1 y D12: los 7 servicios envían sus trazas a Jaeger por OTLP/HTTP con las
# variables estándar de OpenTelemetry (cada SDK les agrega /v1/traces). Solo trazas: las
# métricas van por Prometheus (pull) y los logs por Promtail. OTEL_SDK_DISABLED=true las apaga.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_SAMPLER: parentbased_always_on
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}

services:
  # ---------------------------------------------------------------------------
  # Integración continua (Reto 7). Perfil "ci" (D11): `docker compose up` sigue
  # levantando solo el sistema; la CI se levanta con
  #   docker compose --profile ci up --build -d
  # ---------------------------------------------------------------------------
  # Registro local de imágenes (Reto 7, D3).
  registry:
    container_name: docker-registry
    profiles: ["ci"]
    image: registry:2
    ports:
    - "5000:5000"
    volumes:
    - registry_data:/var/lib/registry
    networks:
    - microservices-network
  # SonarQube y su base de datos (Reto 7, D4).
  sonarqube:
    container_name: sonarqube
    profiles: ["ci"]
    # D20: imagen fijada a 9.9.8 con un arranque que pone límites de disco absolutos.
    build: ./sonar/sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - sonar-db
    networks:
      - microservices-network
    
  # Configuración de SonarQube como código (Reto 7, D15 y D19): contraseña de admin,
  # usuario y token de Jenkins, quality gate "TalentFlow" (>= 70 %) y webhook. Corre y
  # termina; Jenkins arranca solo si terminó bien y lee el token del volumen sonar_token.
  sonar-init:
    container_name: sonar-init
    profiles: ["ci"]
    build:
      context: ./sonar
    environment:
      # Valor académico para arrancar con un solo comando; .env lo sobrescribe.
      - SONAR_ADMIN_PASSWORD=${SONAR_ADMIN_PASSWORD:-talentflow_sonar_2026}
      # Dirección con la que el navegador llega a SonarQube (enlaces desde Jenkins).
      - SONAR_PUBLIC_URL=${SONAR_PUBLIC_URL:-http://localhost:9000}
    volumes:
      - sonar_token:/sonar-token
    depends_on:
      - sonarqube
    networks:
      - microservices-network

  sonar-db:
    container_name: sonar-db
    profiles: ["ci"]
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # Jenkins (Reto 7, D1/D2): imagen propia con plugins y herramientas; trabajos por JCasC.
  jenkins:
    container_name: jenkins
    profiles: ["ci"]
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    # Root dentro del contenedor (D17): quien usa el socket de Docker ya controla el host,
    # así que root aquí no agrega privilegio. Funciona igual en Docker Desktop (socket de
    # root) y en Linux (root:docker con un GID que cambia entre máquinas), sin chmod en el host.
    user: root
    ports:
      - "9090:8080"       # Interfaz web
      - "50000:50000"     # Comunicación con agentes
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Docker del host (Docker-outside-of-Docker)
      - ./jenkins:/var/jenkins_home/casc_configs    # casc.yaml
      - npm_cache:/root/.npm                        # caché de npm entre builds
      - sonar_token:/sonar-token:ro                 # token de SonarQube (lo escribe sonar-init)
      # Workspaces en la MISMA ruta en el host y en el contenedor (D16): los bind mounts
      # que lanzan los pipelines los resuelve el daemon del host. Ejecutar desde la raíz del repo.
      - ${HOST_WORKSPACE:-${PWD}/.jenkins-workspace}:${HOST_WORKSPACE:-${PWD}/.jenkins-workspace}
    environment:
      # Cada trabajo trabaja en <HOST_WORKSPACE>/<nombre del trabajo> (D16).
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Djenkins.model.Jenkins.workspacesDir=${HOST_WORKSPACE:-${PWD}/.jenkins-workspace}/$${ITEM_FULL_NAME}
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs
      # URL con la que Jenkins arma sus enlaces (puerto publicado en el host).
      - JENKINS_URL=${JENKINS_URL:-http://localhost:9090/}
      - HOST_WORKSPACE=${HOST_WORKSPACE:-${PWD}/.jenkins-workspace}
      # Repo y rama que leen los trabajos de casc.yaml (por defecto, main en GitHub).
      - CI_REPO_URL=${CI_REPO_URL:-https://github.com/lyc4nthrope/TalentFlow.git}
      - CI_BRANCH=${CI_BRANCH:-main}
      # D18: administrador de Jenkins. Valor académico para que arranque con un solo
      # comando; para cambiarlo, definir JENKINS_ADMIN_PASSWORD en .env.
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-talentflow_ci_2026}
      # El push lo hace el daemon del host, no el contenedor: para él, el registro es su
      # puerto publicado localhost:5000 (y localhost no exige TLS).
      - REGISTRY_URL=${REGISTRY_URL:-localhost:5000}
      - SONAR_HOST_URL=http://sonarqube:9000
      # Stages SonarQube y Quality Gate de los pipelines (F4); false los salta.
      - SONAR_HABILITADO=${SONAR_HABILITADO:-true}
    depends_on:
      sonar-init:
        condition: service_completed_successfully
    networks:
      - microservices-network


  # Base de Datos Autenticación (PostgreSQL) — Reto 5
  database-auth:
    image: postgres:16-alpine
    container_name: db-auth
    restart: always
    environment:
      POSTGRES_DB: ${DB_AUTH_NAME:-db_auth}
      POSTGRES_USER: ${DB_AUTH_USER:-user_auth}
      POSTGRES_PASSWORD: ${DB_AUTH_PASS:-pass_auth}
    expose:
      - "5432"
    volumes:
      - vol-auth:/var/lib/postgresql/data
      - ./microservicios/auth-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_AUTH_USER:-user_auth} -d ${DB_AUTH_NAME:-db_auth}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Autenticación (Reto 5)
  auth-service:
    build:
      context: ./microservicios/auth-service
      dockerfile: Dockerfile
      target: runner
    container_name: ms-auth
    restart: on-failure
    # D22: solo alcanzable a través del Gateway (regla del Reto 3).
    expose:
      - "8086"
    environment:
      <<: [*jwt, *otel]
      OTEL_SERVICE_NAME: auth-service
      PORT: 8086
      DB_HOST: database-auth
      DB_PORT: 5432
      DB_NAME: ${DB_AUTH_NAME:-db_auth}
      DB_USER: ${DB_AUTH_USER:-user_auth}
      DB_PASS: ${DB_AUTH_PASS:-pass_auth}
      JWT_VIGENCIA: ${JWT_VIGENCIA:-1h}
      # Vigencia de los tokens de activación (alta) y de recuperación de contraseña.
      TOKEN_ACTIVACION_VIGENCIA: ${TOKEN_ACTIVACION_VIGENCIA:-24h}
      TOKEN_RECUPERACION_VIGENCIA: ${TOKEN_RECUPERACION_VIGENCIA:-1h}
      # Administrador semilla: se crea al arrancar si no existe (valores académicos).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
    depends_on:
      database-auth:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      # La imagen distroless no tiene shell ni wget: el propio binario consulta su /health.
      test: ["CMD", "/auth-service", "-salud"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network
  # Base de Datos Empleados (PostgreSQL)
  database-empleados:
    image: postgres:16-alpine
    container_name: db-empleados
    restart: always
    environment:
      POSTGRES_DB: ${DB_EMPLEADOS_NAME:-db_empleados}
      POSTGRES_USER: ${DB_EMPLEADOS_USER:-user_empleados}
      POSTGRES_PASSWORD: ${DB_EMPLEADOS_PASS:-pass_empleados}
    expose:
      - "5432"
    volumes:
      - vol-empleados:/var/lib/postgresql/data
      - ./microservicios/gestion-empleados/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_EMPLEADOS_USER:-user_empleados} -d ${DB_EMPLEADOS_NAME:-db_empleados}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Base de Datos Departamentos (MySQL)
  database-departamentos:
    image: mysql:8.0
    container_name: db-departamentos
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DEPTO_NAME:-db_deptos}
      MYSQL_USER: ${DB_DEPTO_USER:-user_deptos}
      MYSQL_PASSWORD: ${DB_DEPTO_PASS:-pass_deptos}
      MYSQL_ROOT_PASSWORD: ${DB_DEPTO_ROOT_PASS:-root_pass}
    expose:
      - "3306"
    volumes:
      - vol-departamentos:/var/lib/mysql
      - ./microservicios/gestion-departamentos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      # D23: la primera inicialización de MySQL (volumen nuevo) puede tardar más que
      # retries × interval; durante el start_period los fallos no cuentan.
      start_period: 30s

  # API Gateway para exponer un único puerto al cliente
  api-gateway:
    build:
      context: ./microservicios/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Reto 8, D13: las métricas van en un puerto interno aparte, solo en la red de Docker
    # (Prometheus las lee ahí); el 8080 publicado no las sirve.
    expose:
      - "9464"
    environment:
      <<: [*jwt, *otel]
      OTEL_SERVICE_NAME: api-gateway
      PORT: 8080
      METRICS_PORT: 9464
      EMPLEADOS_SERVICE_URL: http://empleados-service:8081
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8082
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8084
      PERFILES_SERVICE_URL: http://perfiles-service:8083
      VACACIONES_SERVICE_URL: http://vacaciones-service:8085
    depends_on:
      - empleados-service
      - departamentos-service
      - notificaciones-service
      - perfiles-service
      - vacaciones-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - microservices-network

  # Microservicio Empleados (Node.js)
  empleados-service:
    build:
      context: .
      dockerfile: ./microservicios/gestion-empleados/Dockerfile
      target: runner
    container_name: ms-empleados
    restart: on-failure
    expose:
      - "8081"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: empleados-service
      PORT: 8081
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${DB_EMPLEADOS_NAME:-db_empleados}
      DB_USER: ${DB_EMPLEADOS_USER:-user_empleados}
      DB_PASS: ${DB_EMPLEADOS_PASS:-pass_empleados}
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8082
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      ZONA_HORARIA: America/Bogota
    depends_on:
      database-empleados:
        condition: service_healthy
      departamentos-service:
        condition: service_healthy
      # La topología de eventos debe existir antes de publicar el primer evento.
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Microservicio Departamentos (PHP)
  # Microservicio Departamentos (PHP)
  departamentos-service:
    build:
      context: ./microservicios/gestion-departamentos
      dockerfile: Dockerfile
      target: runner
    container_name: ms-departamentos
    restart: on-failure
    expose:
      - "8082"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: departamentos-service
      PORT: 8082
      DB_HOST: database-departamentos
      DB_PORT: 3306
      DB_NAME: ${DB_DEPTO_NAME:-db_deptos}
      DB_USER: ${DB_DEPTO_USER:-user_deptos}
      DB_PASS: ${DB_DEPTO_PASS:-pass_deptos}
    depends_on:
      database-departamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8082/health\") === false ? 1 : 0);'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Base de Datos Notificaciones (PostgreSQL) — propia del servicio (Reto 4)
  database-notificaciones:
    image: postgres:16-alpine
    container_name: db-notificaciones
    restart: always
    environment:
      POSTGRES_DB: ${DB_NOTIF_NAME:-db_notificaciones}
      POSTGRES_USER: ${DB_NOTIF_USER:-user_notificaciones}
      POSTGRES_PASSWORD: ${DB_NOTIF_PASS:-pass_notificaciones}
    expose:
      - "5432"
    volumes:
      - vol-notificaciones:/var/lib/postgresql/data
      - ./microservicios/notificaciones/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_NOTIF_USER:-user_notificaciones} -d ${DB_NOTIF_NAME:-db_notificaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Notificaciones (Go) — puramente reactivo: consume eventos (Reto 4)
  notificaciones-service:
    build:
      context: ./microservicios/notificaciones
      dockerfile: Dockerfile
      target: runner
    container_name: ms-notificaciones
    restart: on-failure
    expose:
      - "8084"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: notificaciones-service
      PORT: 8084
      DB_HOST: database-notificaciones
      DB_PORT: 5432
      DB_NAME: ${DB_NOTIF_NAME:-db_notificaciones}
      DB_USER: ${DB_NOTIF_USER:-user_notificaciones}
      DB_PASS: ${DB_NOTIF_PASS:-pass_notificaciones}
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_COLA: notificaciones.eventos
      # Bonus: envío de correo real por SMTP. Sin SMTP_HOST solo queda el log por consola.
      # Mailhog no está en depends_on a propósito: si no está disponible, el servicio
      # arranca igual y cada envío fallido queda en el log (la notificación se guarda).
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: notificaciones@talentflow.local
    depends_on:
      database-notificaciones:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/notificaciones", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - microservices-network

  # Servidor de correo de pruebas (Mailhog) — bonus del Reto 4: recibe los correos de
  # notificaciones-service y los muestra en su UI; no los entrega a ningún buzón real.
  # Los guarda en memoria: se pierden al recrear el contenedor.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    restart: unless-stopped
    expose:
      - "1025"              # SMTP: solo dentro de la red de Docker
    ports:
      - "8025:8025"         # UI web para ver los correos (herramienta de pruebas, ver README)
    networks:
      - microservices-network

  # Base de Datos Perfiles (PostgreSQL) — propia del servicio (Reto 4)
  database-perfiles:
    image: postgres:16-alpine
    container_name: db-perfiles
    restart: always
    environment:
      POSTGRES_DB: ${DB_PERFILES_NAME:-db_perfiles}
      POSTGRES_USER: ${DB_PERFILES_USER:-user_perfiles}
      POSTGRES_PASSWORD: ${DB_PERFILES_PASS:-pass_perfiles}
    expose:
      - "5432"
    volumes:
      - vol-perfiles:/var/lib/postgresql/data
      - ./microservicios/gestion-perfiles/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PERFILES_USER:-user_perfiles} -d ${DB_PERFILES_NAME:-db_perfiles}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Perfiles (Python + FastAPI) — consume eventos y expone REST (Reto 4)
  perfiles-service:
    build:
      context: ./microservicios/gestion-perfiles
      dockerfile: Dockerfile
      target: runner
    container_name: ms-perfiles
    restart: on-failure
    expose:
      - "8083"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: perfiles-service
      DB_HOST: database-perfiles
      DB_PORT: 5432
      DB_NAME: ${DB_PERFILES_NAME:-db_perfiles}
      DB_USER: ${DB_PERFILES_USER:-user_perfiles}
      DB_PASS: ${DB_PERFILES_PASS:-pass_perfiles}
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_COLA: perfiles.eventos
    depends_on:
      database-perfiles:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Base de Datos Vacaciones (PostgreSQL) — propia del servicio (Reto 4)
  database-vacaciones:
    image: postgres:16-alpine
    container_name: db-vacaciones
    restart: always
    environment:
      POSTGRES_DB: ${DB_VACACIONES_NAME:-db_vacaciones}
      POSTGRES_USER: ${DB_VACACIONES_USER:-user_vacaciones}
      POSTGRES_PASSWORD: ${DB_VACACIONES_PASS:-pass_vacaciones}
    expose:
      - "5432"
    volumes:
      - vol-vacaciones:/var/lib/postgresql/data
      - ./microservicios/gestion-vacaciones/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_VACACIONES_USER:-user_vacaciones} -d ${DB_VACACIONES_NAME:-db_vacaciones}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Microservicio Vacaciones (Java + Spring Boot) — REST para RR. HH. y productor de eventos (Reto 4)
  vacaciones-service:
    build:
      context: ./microservicios/gestion-vacaciones
      dockerfile: Dockerfile
      target: runner
    container_name: ms-vacaciones
    restart: on-failure
    expose:
      - "8085"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: vacaciones-service
      # Spring no lee OTEL_SDK_DISABLED: usa su propia propiedad (la CI la pone en false).
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-true}
      PORT: 8085
      DB_HOST: database-vacaciones
      DB_PORT: 5432
      DB_NAME: ${DB_VACACIONES_NAME:-db_vacaciones}
      DB_USER: ${DB_VACACIONES_USER:-user_vacaciones}
      DB_PASS: ${DB_VACACIONES_PASS:-pass_vacaciones}
      RABBITMQ_HOST: message-broker
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_COLA: vacaciones.eventos
      ZONA_HORARIA: America/Bogota
      # Scheduler (Reto 5): inicia y finaliza los períodos al llegar sus fechas. Cron de Spring
      # (seg min hora día mes día-semana); por defecto cada minuto.
      VACACIONES_CRON: ${VACACIONES_CRON:-0 * * * * *}
    depends_on:
      database-vacaciones:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s  # la JVM tarda más en arrancar que Go o Python
    networks:
      - microservices-network

  # Message Broker (RabbitMQ) — comunicación asincrónica por eventos (Reto 4)
  message-broker:
    image: rabbitmq:3.13-management-alpine
    container_name: message-broker
    # Nombre de nodo estable: RabbitMQ guarda sus datos por nombre de nodo
    # (rabbit@<hostname>). Sin hostname fijo, recrear el contenedor cambiaría el
    # nombre y los mensajes persistidos en el volumen quedarían huérfanos.
    hostname: message-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    expose:
      - "5672"              # AMQP: solo dentro de la red de Docker
    ports:
      - "15672:15672"       # UI de administración (excepción al Gateway, ver README)
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - microservices-network

  # Paso de inicialización (se ejecuta y termina): importa la topología de eventos
  # (infra/rabbitmq/definitions.json). Productores y consumidores esperan a que
  # termine con éxito, así el exchange y las colas existen antes del primer evento.
  broker-init:
    image: rabbitmq:3.13-management-alpine
    container_name: broker-init
    entrypoint: ["sh", "/importar-definiciones.sh"]
    restart: "no"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin}
    volumes:
      - ./infra/rabbitmq/importar-definiciones.sh:/importar-definiciones.sh:ro
      - ./infra/rabbitmq/definitions.json:/definitions.json:ro
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - microservices-network

  # ---------------------------------------------------------------------------
  # Observabilidad (Reto 8). Sin perfil (D3): `docker compose up` la levanta con el
  # sistema. Imágenes en versiones exactas (D11); configuración en observability/ (D6).
  # Los puertos del host se pueden cambiar en .env si ya están ocupados.
  # ---------------------------------------------------------------------------
  # Métricas (modelo pull). En el host va en 9091 porque Jenkins (Reto 7) ocupa el 9090
  # (D2); dentro de la red sigue siendo prometheus:9090.
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retención modesta para no llenar el disco en un entorno local.
      - --storage.tsdb.retention.time=7d
      # Permite recargar la configuración con POST /-/reload sin reiniciar.
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Logs: almacén (Loki) y agente que los recolecta de los contenedores (Promtail).
  # La imagen de Loki es distroless (sin shell ni wget): sin healthcheck; su estado se ve
  # en http://localhost:3100/ready.
  loki:
    image: grafana/loki:3.6.19
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - microservices-network

  # Promtail 3.6.11 es la última versión publicada (Grafana lo reemplaza por Alloy); el
  # PDF lo pide y es compatible con Loki 3.6. Lee los logs por la API de Docker: basta el
  # socket (solo lectura), en Linux y en Docker Desktop. Root para poder leer el socket
  # (root:docker en Linux), igual que Jenkins (Reto 7, D17).
  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    restart: unless-stopped
    user: root
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - microservices-network

  # Trazas (D1): Jaeger v2 en modo all-in-one (colector + almacenamiento en memoria + UI),
  # recibe OTLP en 4317 (gRPC) y 4318 (HTTP) directamente. Los puertos OTLP solo dentro de
  # la red: los servicios envían a http://jaeger:4318. Las trazas viven en memoria y se
  # pierden al recrear el contenedor (entorno local).
  # Fijado en 2.20.0: desde 2.21 Jaeger quitó la API HTTP v1 (/api/services, /api/traces)
  # y solo deja /api/v3, pero la fuente de datos Jaeger de Grafana 12 todavía usa la v1.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped
    expose:
      - "4317"
      - "4318"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # UI
    healthcheck:
      # Extensión healthcheckv2 de Jaeger v2.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  # Visualización y alertas. Fuentes de datos y dashboards aprovisionados desde archivos
  # (D6); datos persistidos en grafana-data.
  grafana:
    image: grafana/grafana:12.4.14
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Administrador: valor académico para arrancar con un solo comando; .env lo sobrescribe.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-talentflow_grafana_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Canal de las alertas (D8, F10): email por el SMTP de Mailhog (sin autenticación).
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=mailhog:1025
      - GF_SMTP_FROM_ADDRESS=alertas@talentflow.local
      - GF_SMTP_FROM_NAME=TalentFlow Alertas
      - GF_SMTP_SKIP_VERIFY=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  vol-auth:
  vol-empleados:
  vol-departamentos:
  vol-rabbitmq:
  vol-notificaciones:
  vol-perfiles:
  vol-vacaciones:
  # Reto 7 (perfil "ci")
  jenkins_data:
  npm_cache:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:
  registry_data:
  sonar_token:
  # Reto 8 (observabilidad)
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:
