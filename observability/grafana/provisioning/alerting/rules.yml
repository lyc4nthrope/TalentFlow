# Reglas de alerta como código (Reto 8, D6 y D9): las 3 primeras del PDF. Se evalúan cada
# 30 s; "for" es cuánto debe sostenerse la condición antes de avisar (evita falsas alarmas
# por un pico aislado). Sin datos (p. ej. sin tráfico) = OK: no hay errores ni latencia que
# medir. Las consultas usan el contrato común de métricas de los 7 servicios (D5).
apiVersion: 1
groups:
- orgId: 1
  name: TalentFlow
  folder: TalentFlow
  interval: 30s
  rules:
  - uid: servicio-caido
    title: Servicio caído
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        # Sin las sondas del Blackbox (job dependencias): sus BD tienen su propia alerta.
        expr: up{job!~"prometheus|dependencias"}
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    for: 1m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: critical
      team: talentflow
    annotations:
      summary: '{{ $labels.job }} no responde'
      description: Prometheus no puede leer /metrics de {{ $labels.job }} desde hace más de 1 minuto (up == 0). El servicio está caído o no es alcanzable en la red de Docker.
      dashboardUid: talentflow-observabilidad
  - uid: tasa-errores-5xx
    title: Alta tasa de errores 5xx
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum by (job) (rate(http_requests_total{status=~"5..",route!="/health"}[2m])) / sum by (job) (rate(http_requests_total{route!="/health"}[2m]))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.1
    for: 2m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: warning
      team: talentflow
    annotations:
      summary: '{{ $labels.job }} responde con errores 5xx'
      description: 'Más del 10 % de las respuestas de {{ $labels.job }} son errores del servidor (5xx) desde hace más de 2 minutos (sin contar /health: una dependencia caída tiene su propia alerta). Valor actual: {{ humanizePercentage $values.A.Value }}.'
      dashboardUid: talentflow-observabilidad
  - uid: latencia-alta
    title: Alta latencia
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum by (job) (rate(http_request_duration_seconds_sum{route!="/health"}[2m])) / sum by (job) (rate(http_request_duration_seconds_count{route!="/health"}[2m]))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
    for: 2m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: warning
      team: talentflow
    annotations:
      summary: '{{ $labels.job }} responde lento'
      description: 'La latencia promedio de {{ $labels.job }} supera 2 s desde hace más de 2 minutos (sin contar /health). Valor actual: {{ humanizeDuration $values.A.Value }}. Revisar su traza en Jaeger
        para ver qué dependencia tarda.'
      dashboardUid: talentflow-observabilidad
  # Reto 8, D22: el estado de cada BD y del broker sale de una sonda TCP directa (Blackbox
  # Exporter, job dependencias), no del /health del servicio: se sabe aunque el servicio
  # dueño esté caído. Se cruza con talentflow_health_check (D20/D21) por la etiqueta service.
  - uid: base-de-datos-caida
    title: Base de datos caída
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: probe_success{job="dependencias",check="database"}
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    for: 1m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: critical
      team: talentflow
    annotations:
      summary: 'La base de datos de {{ $labels.service }} no responde'
      description: 'La sonda TCP directa a {{ $labels.instance }} (base de datos de {{ $labels.service }}) falla desde hace más de 1 minuto. La sonda es independiente del servicio: vale aunque {{ $labels.service }} esté caído. Si el servicio también cae, llega además Servicio caído.'
      dashboardUid: talentflow-observabilidad
  - uid: broker-caido
    title: Broker caído
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: probe_success{job="dependencias",check="messageBroker"}
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    for: 1m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: critical
      team: talentflow
    annotations:
      summary: 'El broker de mensajería no responde'
      description: 'La sonda TCP directa a {{ $labels.instance }} (RabbitMQ, AMQP) falla desde hace más de 1 minuto. Los eventos entre servicios no se publican ni se consumen.'
      dashboardUid: talentflow-observabilidad
  # Solo avisa cuando el servicio reporta su dependencia en DOWN pero la sonda directa la ve
  # UP (credenciales, red o pool del servicio): si la dependencia está realmente caída ya
  # avisan Base de datos caída o Broker caído, y no se duplica el correo. Suma = 0 solo en
  # ese caso (servicio 0 + (1 - sonda 1)); con la dependencia caída da 1 y no dispara.
  - uid: dependencia-caida
    title: Dependencia caída
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: talentflow_health_check{check="database"} + on(service) group_left() (1 - probe_success{job="dependencias",check="database"}) or talentflow_health_check{check="messageBroker"} + on() group_left() (1 - probe_success{job="dependencias",check="messageBroker"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    for: 1m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: critical
      team: talentflow
    annotations:
      summary: '{{ $labels.service }} no puede usar su {{ $labels.check }}'
      description: 'El /health de {{ $labels.service }} reporta {{ $labels.check }} en DOWN desde hace más de 1 minuto, pero la sonda directa la ve UP: el problema está entre el servicio y su dependencia (credenciales, red, pool de conexiones). Ver GET http://localhost:8080/health/{{ $labels.service }}.'
      dashboardUid: talentflow-observabilidad
