# Prometheus de TalentFlow (Reto 8, F1). Modelo pull: cada 15 s pide las métricas a
# cada microservicio por su nombre de servicio en Docker (nunca IPs ni localhost),
# dentro de la red microservices-network. Los puertos son los internos de cada servicio.
#
# Hasta que cada servicio exponga sus métricas (F2 a F5), su target aparece DOWN: es
# lo esperado.
#
# Ruta de las métricas según el lenguaje (PDF, sección 3):
#   Node (Express, prom-client)         /metrics           api-gateway, empleados-service
#   PHP (promphp/prometheus_client_php) /metrics           departamentos-service
#   Python (FastAPI)                    /metrics           perfiles-service
#   Go (client_golang)                  /metrics           notificaciones-service, auth-service
#   Java (Spring Boot Actuator)         /actuator/prometheus  vacaciones-service

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # El Gateway va primero (PDF): es la entrada única y su latencia y tasa de error son
  # las que ve el cliente. Puerto 9464 y no 8080 como en el ejemplo del PDF (D13): el 8080
  # está publicado en el host y no debe exponer las métricas.
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:9464']

  - job_name: 'empleados-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['empleados-service:8081']

  - job_name: 'departamentos-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['departamentos-service:8082']

  - job_name: 'perfiles-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['perfiles-service:8083']

  - job_name: 'notificaciones-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notificaciones-service:8084']

  # Spring Boot publica las métricas de Micrometer en Actuator, no en /metrics.
  - job_name: 'vacaciones-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['vacaciones-service:8085']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:8086']

  # Sondas directas (D22): Prometheus pide al Blackbox Exporter que abra una conexión TCP a
  # cada base de datos y al broker. El estado de la BD ya no depende de que su servicio
  # responda. Las etiquetas service y check son las mismas de talentflow_health_check, para
  # cruzar ambas en el dashboard y en las alertas.
  - job_name: 'dependencias'
    metrics_path: '/probe'
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['database-empleados:5432']
        labels: { service: 'empleados-service', check: 'database' }
      - targets: ['database-departamentos:3306']
        labels: { service: 'departamentos-service', check: 'database' }
      - targets: ['database-perfiles:5432']
        labels: { service: 'perfiles-service', check: 'database' }
      - targets: ['database-notificaciones:5432']
        labels: { service: 'notificaciones-service', check: 'database' }
      - targets: ['database-vacaciones:5432']
        labels: { service: 'vacaciones-service', check: 'database' }
      - targets: ['database-auth:5432']
        labels: { service: 'auth-service', check: 'database' }
      - targets: ['message-broker:5672']
        labels: { service: 'message-broker', check: 'messageBroker' }
    # Relabeling estándar del Blackbox: el target pasa a ser el parámetro ?target= de la
    # sonda, queda como instance, y la petición real va al exporter.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # El propio Prometheus.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
