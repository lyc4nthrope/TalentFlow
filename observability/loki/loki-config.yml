# Loki de TalentFlow (Reto 8, F1): un solo proceso (monolítico), almacenamiento en el
# sistema de archivos del volumen loki-data y sin autenticación (entorno local).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retención modesta: 7 días bastan para depurar y no llenan el disco.
  retention_period: 168h
  allow_structured_metadata: true

# El compactor es quien borra lo que supera la retención.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
