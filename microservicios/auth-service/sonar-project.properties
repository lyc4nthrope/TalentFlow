# Identificador y nombre del proyecto
sonar.projectKey=gestion-go
sonar.projectName=Gestion Go

# Rutas del código fuente (excluyendo archivos de prueba de las métricas de fuentes)
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Reporte de cobertura generado por 'go test'
sonar.go.coverage.reportPaths=coverage.out