server:
  port: ${PORT:8085}

spring:
  application:
    name: ${OTEL_SERVICE_NAME:vacaciones-service}  # service.name de las trazas
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_vacaciones}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
    hikari:
      connection-timeout: 3000  # falla rápido si la BD no responde (no colgar peticiones)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    connection-timeout: 3s
    publisher-confirm-type: simple  # confirmaciones del broker al publicar
    listener:
      simple:
        prefetch: 10
        missing-queues-fatal: false  # la cola la crea broker-init; si falta, reintenta
        default-requeue-rejected: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true  # campos fuera del contrato → 400 (asignación masiva)
    serialization:
      write-dates-as-timestamps: false  # fechas ISO-8601, no números

# Reto 8: solo se publica el endpoint de Prometheus (el /health propio sigue en SaludController).
# El 8085 no está publicado en el host: solo Prometheus, dentro de la red de Docker, lo alcanza.
management:
  # Reto 8 (D1, D12): trazas a Jaeger por OTLP/HTTP, 100 % de muestreo, propagación W3C
  # (la de por defecto). En la copia aislada de la CI no hay Jaeger: allí se apagan.
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: prometheus

springdoc:
  api-docs:
    path: /vacaciones/openapi.json
  paths-to-match: /vacaciones/**

vacaciones:
  # Frecuencia del scheduler (cron de Spring: seg min hora día mes día-semana). "-" lo desactiva.
  cron: ${VACACIONES_CRON:0 * * * * *}  # cada minuto
  zona-horaria: ${ZONA_HORARIA:America/Bogota}
  eventos:
    exchange: ${RABBITMQ_EXCHANGE:talentflow.eventos}
    cola: ${RABBITMQ_COLA:vacaciones.eventos}
    timeout-confirmacion-ms: 3000
    espera-reintento-ms: 5000
