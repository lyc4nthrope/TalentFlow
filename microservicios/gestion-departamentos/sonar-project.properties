sonar.projectKey=gestion-departamentos
sonar.projectName=Gestion Departamentos
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Mismas exclusiones de cobertura que phpunit.xml
sonar.coverage.exclusions=src/Database.php,src/cargar.php

# Reportes de PHPUnit que genera `make test` (stage Test)
sonar.php.coverage.reportPaths=reports/clover.xml
sonar.php.tests.reportPath=reports/junit.xml
